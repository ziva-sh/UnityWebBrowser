# Builds the Ziva-patched CEF engine (SafeInvoke barriers — survives Unity domain-reload
# reattach) as ready-to-host UPM package tarballs. Mirrors upstream main.yml's
# build-engine-cef job; kept separate so ziva/* pushes never run upstream's Unity-project
# jobs (they need Unity license secrets we don't carry).
#
# CEF has no universal macOS build, so the two mac legs are genuinely separate engines —
# Ziva's mac zips ship one each, alongside a universal sidecar. Both cross-compile from the
# same macos-14 (arm64) runner, matching upstream's matrix.
name: Ziva Engine Build

on:
  push:
    branches:
      - "ziva/**"
  workflow_dispatch:

jobs:
  build-engine-cef:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 matches upstream: the oldest supported glibc baseline the package
        # promises. If GitHub retires the runner this fails loudly — bump it consciously.
        include:
          - os: ubuntu-22.04
            build: linux64
            package: Linux-x64
          - os: windows-2022
            build: windows64
            package: Win-x64
          # macos-14 is Apple Silicon; the x64 leg is a `dotnet publish -r osx-x64`
          # cross-build off the same runner, exactly as upstream does it.
          - os: macos-14
            build: macosarm64
            package: MacOS-arm64
          - os: macos-14
            build: macosx64
            package: MacOS-x64

    runs-on: ${{ matrix.os }}
    name: Ziva-Engine-CEF-${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # Nerdbank.GitVersioning fails on shallow clones
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        name: Setup .NET
        with:
          dotnet-version: "10.x"

      # The DevScripts are invoked as `python`, which only the ubuntu/windows images
      # provide unprompted. Pin it for every leg rather than branching per-OS.
      - uses: actions/setup-python@v6
        name: Setup Python
        with:
          python-version: "3.12"

      - name: Download CEF ${{ matrix.build }}
        run: python download_cef_${{ matrix.build }}.py
        working-directory: src/DevScripts/

      - name: Build CEF Engine ${{ matrix.build }}
        run: python build_cef_${{ matrix.build }}.py
        working-directory: src/DevScripts/

      # build_base_macos.py assembles the .app but signs nothing, and Apple Silicon
      # refuses to exec an unsigned Mach-O — the engine would be SIGKILLed on every
      # M-series Mac. Ad-hoc is enough (same treatment the zivacode sidecar gets in
      # apps/plugin-server/scripts/build.ts) and needs no signing identity in CI.
      # Nested code must be signed before its container, so this runs inside-out.
      - name: Ad-hoc sign CEF Engine ${{ matrix.package }}
        if: startsWith(matrix.os, 'macos')
        working-directory: src/Packages/UnityWebBrowser.Engine.Cef.${{ matrix.package }}/Engine~
        run: |
          set -euo pipefail
          app="UnityWebBrowser.Engine.Cef.app"
          for helper in "$app"/Contents/Frameworks/*.app; do
            codesign --force --sign - "$helper"
          done
          codesign --force --sign - "$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Create Artifacts Staging Directory
        shell: pwsh
        run: mkdir ${{ github.workspace }}/UWBStaging/

      - name: Pack CEF Engine ${{ matrix.package }} Package
        shell: pwsh
        run: npm pack --pack-destination ${{ github.workspace }}/UWBStaging/
        working-directory: src/Packages/UnityWebBrowser.Engine.Cef.${{ matrix.package }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Ziva-Engine-CEF-${{ matrix.package }}
          path: ${{ github.workspace }}/UWBStaging/*.tgz
          if-no-files-found: error
